
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANAKYA AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:22px;background:#111a30;border-bottom:1px solid #c69b42}
.logo{font-size:25px;font-weight:bold;color:#e9bd63}
.tag{color:#aaa;font-size:12px;margin-top:6px}
main{max-width:650px;margin:auto;padding:22px}
h1{font-size:30px;margin-top:35px}
.gold{color:#e9bd63}
p{color:#b8c0d3;line-height:1.6}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}
.tool{background:#151f36;border:1px solid #34415b;color:white;padding:17px;border-radius:12px;text-align:left;font-size:15px}
.tool:active{border-color:#e9bd63}
textarea{width:100%;height:125px;background:#151f36;color:white;border:1px solid #52617b;border-radius:12px;padding:15px;font-size:16px}
button{cursor:pointer}
.send{width:100%;padding:15px;background:#d5a94e;color:#101522;border:0;border-radius:10px;font-weight:bold;font-size:16px;margin-top:12px}
#answer{background:#151f36;padding:17px;border-radius:12px;margin-top:20px;display:none;line-height:1.6;white-space:pre-wrap}
footer{text-align:center;color:#8993a8;padding:30px;font-size:12px}
</style>
</head>
<script src="chat.js"></script>
<body>
<header>
<div class="logo">✦ CHANAKYA AI</div>
<div class="tag">ANCIENT WISDOM, MODERN INTELLIGENCE</div>
</header>
<main>
<h1>Namaste! Welcome to <span class="gold">Chanakya AI</span></h1>
<p>Aapka smart AI assistant. Padho, likho aur naye ideas explore karo.</p>

<h3 class="gold">Choose Your Tool</h3>
<div class="tools">
<button class="tool" onclick="choose('Mujhe padhai mein madad karo')">📚 Study Helper</button>
<button class="tool" onclick="choose('Mere liye ek social media caption likho')">✍️ Caption Maker</button>
<button class="tool" onclick="choose('Mere YouTube video ke titles batao')">▶️ YouTube Titles</button>
<button class="tool" onclick="choose('Mujhe translation mein madad karo')">🌐 Translator</button>
<button class="tool" onclick="choose('Mera resume banane mein madad karo')">📄 Resume Helper</button>
<button class="tool" onclick="choose('Mujhe creative ideas do')">💡 Creative Ideas</button>
</div>

<textarea id="prompt" placeholder="Yahan apna sawaal likho..."></textarea>
<button class="send" onclick="ask()">Ask Ayntrix AI→</button>
<div id="answer"></div>
</main>
<footer>© 2026 Ayntrix AI| Made with ambition</footer>

<script>
function choose(text){
document.getElementById('prompt').value=text;
document.getElementById('prompt').focus();
}
function ask(){
let q=document.getElementById('prompt').value.trim();
let a=document.getElementById('answer');
if(!q){alert('Pehle apna sawaal likho!');return;}
a.style.display='block';
a.textContent='Ayntrix AIka interface taiyaar hai! Abhi AI service connect nahi hui hai. Agle step mein asli AI connect karenge.';
}
</script>
<script src="chat.js"></script>
</body>
</html>
